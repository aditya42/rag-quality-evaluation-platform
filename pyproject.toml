[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-release-gate"
version = "0.1.0"
description = "Paired RAG regression evaluation with RAGAS, DeepEval, and LangSmith"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "aditya42"}]
dependencies = ["pydantic==2.14.1", "PyYAML==6.0.3", "httpx[socks]==0.28.1"]

[project.optional-dependencies]
eval = [
  "ragas==0.4.3", "deepeval==4.3.1", "langsmith==0.14.12", "openai==2.54.0",
  "langchain==0.3.27", "langchain-core==0.3.79", "langchain-community==0.3.31",
  "langchain-openai==0.3.35", "langchain-text-splitters==0.3.11",
]
dev = ["pytest==9.1.1", "ruff==0.17.2", "build==1.6.1"]

[project.scripts]
rag-gate = "rag_release_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:deepeval -p no:langsmith_plugin"
markers = ["sdk: actual evaluation SDK contract tests using deterministic wire fixtures"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
