name: Explicit hosted judge evaluation
on:
  workflow_dispatch:
    inputs:
      judge_base_url:
        description: Publicly reachable OpenAI-compatible /v1 base URL
        required: true
        type: string
      judge_model:
        description: Installed model or hosted model ID
        required: true
        type: string
      engine:
        type: choice
        options: [ragas, deepeval, both]
        default: both
      case_limit:
        type: choice
        options: ['2', '4', '48']
        default: '2'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JUDGE_BASE_URL: ${{ inputs.judge_base_url }}
      JUDGE_MODEL: ${{ inputs.judge_model }}
      JUDGE_API_KEY: ${{ secrets.JUDGE_API_KEY }}
      JUDGE_TIMEOUT: '120'
      EVAL_ENGINE: ${{ inputs.engine }}
      CASE_LIMIT: ${{ inputs.case_limit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --extra eval
      - name: Require explicit judge credential
        run: test -n "$JUDGE_API_KEY"
      - name: Run semantic evaluation of the extractive pipeline
        run: uv run --frozen rag-gate run --engine "$EVAL_ENGINE" --limit "$CASE_LIMIT" --concurrency 1 --output reports/live-judge
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hosted-judge-report
          path: reports/live-judge/
          retention-days: 14
