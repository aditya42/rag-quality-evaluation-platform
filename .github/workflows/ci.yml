name: RAG quality and SDK contracts
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      DEEPEVAL_TELEMETRY_OPT_OUT: 'YES'
      RAGAS_DO_NOT_TRACK: 'true'
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --all-extras
      - run: uv run --frozen ruff check src tests scripts
      - run: uv run --frozen ruff format --check src tests scripts
      - run: uv run --frozen pytest --junitxml=test-results.xml
      - run: uv run --frozen rag-gate demo
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rag-quality-${{ matrix.python-version }}
          path: |
            reports/
            test-results.xml
          retention-days: 14
